query StudioShippingAccess{shop{myshopifyDomain currencyCode}currentAppInstallation{accessScopes{handle}}}
query StudioShippingMarkets($after:String){markets(first:2,after:$after){pageInfo{hasNextPage endCursor}nodes{id name status conditions{regionsCondition{regions(first:250){pageInfo{hasNextPage}nodes{... on MarketRegionCountry{code}}}}}}}}
query StudioShippingProfiles($after:String){deliveryProfiles(first:2,after:$after){pageInfo{hasNextPage endCursor}nodes{id name default profileLocationGroups{locationGroup{id locations(first:20,includeLegacy:true){pageInfo{hasNextPage}nodes{id name}}}}}}}
query StudioShippingZones($id:ID!,$groupId:ID!,$after:String){deliveryProfile(id:$id){profileLocationGroups(locationGroupId:$groupId){locationGroupZones(first:5,after:$after){pageInfo{hasNextPage endCursor}nodes{zone{id name countries{code{countryCode restOfWorld}provinces{code}}}methodDefinitions(first:50){pageInfo{hasNextPage}nodes{id name active methodConditions{field}rateProvider{... on DeliveryRateDefinition{price{amount currencyCode}}}}}}}}}}
mutation StudioShippingProfile($id:ID!,$profile:DeliveryProfileInput!){deliveryProfileUpdate(id:$id,profile:$profile){profile{id name}userErrors{field message}}}