<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Vane — Header and search review</title><link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/catalog.css"><link rel="stylesheet" href="../assets/header.css"><script src="../assets/header.js" defer></script><script src="../assets/catalog.js" defer></script></head><body><section class="main-search-section section-spacing hairline-bottom" data-search-page>
  <div class="container">

    <div class="search-page-form"><div class="atelier-search" data-predictive-search data-predictive-url="/search/suggest">
  <form action="/search" method="get" role="search" class="atelier-search__form">

    <div class="atelier-search__controls">
      <input class="form-input" type="search" name="q" id="SearchInput-fixture-search" value="" placeholder="Search our atelier" data-search-input>
      <input type="hidden" name="type" value="product,page">
      <input type="hidden" name="options[prefix]" value="last">
      <button class="btn btn--primary" type="submit">Search</button>
    </div>
  </form><p class="catalog-status" data-search-status role="status" aria-live="polite"></p>
    <div id="SearchInput-fixture-search-results" class="predictive-results" data-search-results role="listbox" aria-label="Search suggestions" hidden></div></div>
</div><p class="search-page-count" role="status">0 results for “&lt;script&gt;test&lt;/script&gt;”</p>

</section>
